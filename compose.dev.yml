services:
  mongodb:
    image: "mongo"
    restart: unless-stopped
    volumes:
      - hd_data:/data/db
      - ./mongodb/docker-entrypoint-wrapper.sh:/docker-entrypoint-wrapper.sh:ro
    env_file:
      - .env.dev
    ports:
      - "27017:27017"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - hd_uploads:/app/uploads
    environment:
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env.dev
    depends_on:
      - mongodb
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    env_file:
      - .env.dev
    stdin_open: true
    tty: true
    depends_on:
      - backend
  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    volumes:
      - ./telegram-bot:/app
      - /app/node_modules
    env_file:
      - .env.dev
    depends_on:
      - mongodb
      - backend

  # Замена telegram-bot. Под профилем НАМЕРЕННО: два отправщика на одну очередь
  # означают гонку за уведомление и, при неудачном порядке, дубль в чате.
  # Поднимать вместо старого, а не рядом:
  #   docker compose stop telegram-bot
  #   docker compose --profile tg-next up -d --build tg-service
  tg-service:
    profiles: ["tg-next"]
    build:
      context: ./tg-service
      dockerfile: Dockerfile
    volumes:
      - ./tg-service:/app
      - /app/node_modules
      - tg_service_data:/app/data
    environment:
      BACKEND_URL: http://backend:8080
    env_file:
      - .env.dev
    depends_on:
      - backend

volumes:
  tg_service_data:
  hd_data:
    external: true
  hd_uploads:
    external: true
