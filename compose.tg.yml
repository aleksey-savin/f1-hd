# Telegram-сервис ОТДЕЛЬНО от остального стека.
#
# Это весь файл целиком — один сервис, один том, три переменных. Ни MongoDB, ни
# SMTP, ни S3, ни ключей шифрования здесь нет, потому что сервису они не нужны:
# всё, что ему требуется, он спрашивает у API.
#
# Входящих портов не нужно вовсе: и длинный опрос Telegram, и обращения к
# бэкенду — исходящие. `/health` слушает только петлю, для healthcheck.
#
#   docker compose -f compose.tg.yml up -d --build
#
# Прежний бот так работать не мог: адрес Mongo (`mongodb`) и адрес бэкенда
# (`http://backend:8080`) были вписаны в код именами из compose, а очередь он
# читал прямым подключением к базе с root-учёткой.

services:
  tg-service:
    build:
      context: ./tg-service
      dockerfile: Dockerfile.prod
    container_name: hd-tg-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Токен бота у BotFather
      TG_TOKEN: ${TG_TOKEN}
      # Общий секрет с бэкендом — тот же, что в его окружении
      TG_API_TOKEN: ${TG_API_TOKEN}
      # Публичный адрес API: https://<домен>, а не имя из compose
      BACKEND_URL: ${BACKEND_URL}
      # Адрес портала для кнопки «Подробнее» под заявкой
      ADDRESS: ${ADDRESS}
    volumes:
      # Состояние: что доставлено, что нарисовано, где остановился диалог.
      # Терять его не страшно — уведомление может уйти повторно, — но и незачем.
      - tg_service_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

volumes:
  tg_service_data:
