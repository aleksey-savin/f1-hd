# nginx inside the frontend image: serves the SPA and proxies the API.
#
# This file is included by the image's nginx.conf inside the http{} block, so it
# holds only what belongs to the site. The container listens on 8080 (the
# unprivileged image); compose publishes it as HTTP_PORT. TLS is not here: an
# external reverse proxy terminates it and passes X-Forwarded-Proto.

# Keep the scheme the external proxy saw; without this the backend would be told
# "http" for every request and build wrong absolute links.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    root /usr/share/nginx/html;

    # API and uploads go to the backend. `^~` outranks the static-asset regex
    # below, so /uploads/<image> reaches the resolver (local file or S3 redirect)
    # and /api/<anything>.js is never mistaken for a static file.
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed build assets: cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SPA. Security headers are set HERE, not in the app: nginx serves the
    # document, and the policy has to travel with it. The backend only serves
    # /api and /uploads and carries its own, narrower headers.
    #
    # CSP is the second line behind DOMPurify (ticket descriptions). style-src
    # needs 'unsafe-inline' for React's real inline styles; script-src has none
    # on purpose — that is the restriction CSP exists for. img-src/media-src
    # allow any https: because attachments may live in S3 and /uploads/<file>
    # answers with a redirect to a presigned URL on another host.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
