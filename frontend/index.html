<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: экранная клавиатура сжимает окно, а
         не ложится поверх него. Шелл, шторки и диалоги привязаны к окну (fixed,
         dvh) — без ключа Chrome 108+ на Android оставляет их низ под
         клавиатурой, и до него не докрутить. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Название, значок и манифест — из «Настроек → Бренд»: их отдаёт бэкенд
         (`/api/brand/*`, без входа; значок не задан — нейтральный по умолчанию).
         Название вкладки дописывает приложение: «страница · название портала». -->
    <title>HelpDesk</title>
    <link rel="icon" type="image/png" href="/api/brand/icon" />
    <link rel="apple-touch-icon" href="/api/brand/icon" />
    <link rel="manifest" href="/api/brand/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
