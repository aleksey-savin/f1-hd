worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 0;
    gzip_types text/plain application/javascript text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    server {
        listen 80;
        server_name localhost;

        # API requests - proxy to backend
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploads - proxy to backend. ^~ so it outranks the static-asset regex
        # below and ALL /uploads/* (incl. images) hit the backend resolver,
        # which serves legacy files locally and redirects new ones to S3.
        location ^~ /uploads/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Main application (React SPA)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Заголовки безопасности ставятся ЗДЕСЬ, а не в приложении: документ
            # раздаёт nginx, и политика обязана приехать вместе с ним. Бэкенд
            # отдаёт только /api и /uploads — у него своя, более узкая.
            #
            # CSP — вторая линия к DOMPurify, который чистит описания заявок.
            # `unsafe-inline` в style-src нужен настоящим инлайновым стилям,
            # которые ставит React; в script-src его нет намеренно — именно он
            # и превращает CSP в украшение.
            # `img-src`/`media-src` допускают ЛЮБОЙ https намеренно: вложения
            # лежат в S3, и /uploads/<файл> отвечает редиректом на presigned-URL
            # чужого хоста. Со списком из одного 'self' все картинки в заявках
            # погасли бы разом, а адрес хранилища задаётся переменной окружения и
            # в конфиг nginx не попадает. Картинка — слабый вектор; ограничение,
            # ради которого CSP и ставится, живёт в script-src.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # Портал не просит ни камеру, ни микрофон, ни геолокацию.
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
